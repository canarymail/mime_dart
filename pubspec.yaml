name: mime_dart
description: Pure Dart MIME message parser and builder. Parse and generate MIME/email messages with support for various encodings, attachments, and multipart content.
version: 1.0.0
homepage: https://github.com/Enough-Software/enough_mail
topics:
  - email
  - mime
  - parser
  - builder


environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

dependencies:
  collection: ^1.19.1
  # Fork of enough_convert, renamed to match this package. Carries the charset
  # codecs upstream lacks — notably the CJK ones (Shift_JIS, EUC-JP, EUC-KR),
  # without which those messages cannot be decoded at all.
  mime_convert:
    git:
      url: https://github.com/canarymail/mime_convert.git
  intl: any

dependency_overrides:
  # http: ^1.4.0 # for dart_code_metrics
  # Resolve mime_convert from the sibling submodule when developing this package
  # standalone, so local codec work is picked up without pushing first. Ignored
  # when mime_dart is itself a dependency — only the root package's overrides
  # apply — so consumers still get the git source declared above.
  mime_convert:
    path: ../mime_convert

dev_dependencies:
  dart_code_linter: ^3.0.0
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  test: ^1.26.3
